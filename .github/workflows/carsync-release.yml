name: CarSync build and release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['builder/**', '.github/workflows/carsync-release.yml']
permissions:
  contents: write
concurrency:
  group: carsync-release
  cancel-in-progress: false
jobs:
  release:
    if: vars.CARSYNC_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build, verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
          CARSYNC_BASE_URL: ${{ secrets.CARSYNC_BASE_URL }}
          CARSYNC_KEYSTORE_BASE64: ${{ secrets.CARSYNC_KEYSTORE_BASE64 }}
          CARSYNC_STORE_PASSWORD: ${{ secrets.CARSYNC_STORE_PASSWORD }}
          CARSYNC_KEY_PASSWORD: ${{ secrets.CARSYNC_KEY_PASSWORD }}
          CARSYNC_KEY_ALIAS: ${{ secrets.CARSYNC_KEY_ALIAS }}
        run: python3 builder/ci_release.py
