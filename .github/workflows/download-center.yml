
name: Download Center APK
on:
  push:
    branches: ['codex/download-center-v1']
    paths: ['download-center/**', '.github/workflows/download-center.yml']
  pull_request:
    paths: ['download-center/**', '.github/workflows/download-center.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Validate catalog contract
        run: python3 download-center/tests/test_catalog.py
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build and lint
        working-directory: download-center
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Verify APK signature
        run: |
          mkdir -p download-center/dist
          cp download-center/app/build/outputs/apk/debug/app-debug.apk download-center/dist/CarDownloadCenter_0.1.0_test.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs download-center/dist/CarDownloadCenter_0.1.0_test.apk > download-center/dist/signature.txt
          sha256sum download-center/dist/CarDownloadCenter_0.1.0_test.apk > download-center/dist/SHA256SUMS.txt
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: CarDownloadCenter-0.1.0-test
          path: download-center/dist/
          if-no-files-found: error
          retention-days: 90
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DownloadCenter-lint
          path: download-center/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
